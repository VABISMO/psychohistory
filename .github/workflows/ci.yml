name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install fastapi httpx pydantic pymongo mongomock uvicorn
      - name: Run tests
        run: |
          cd backend
          for t in tests/test_math.py tests/test_temporal.py tests/test_coupling.py tests/test_actors.py tests/test_uncertainty.py tests/test_schema.py tests/test_search.py tests/test_constraints.py tests/test_grounding.py tests/test_metrics.py tests/test_evaluation.py; do
            python "$t"
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          cd frontend
          npm install --no-audit --no-fund
      - name: Typecheck
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Build
        run: |
          cd frontend
          npx next build
